<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Horizontal page overflow on mobile</title>
    <meta name="fixture-viewport" content="375x667" />
    <style>
      body {
        margin: 16px;
        font: 16px/1.4 sans-serif;
      }
      .case {
        margin: 0 0 24px;
      }
      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <form class="case" style="width: 420px" data-expect="page-scroll">
      <label data-expect="ok">Email</label> <input style="width: 200px" data-expect="ok" />
    </form>
    <!-- A long word spills out of its paragraph and past the viewport -->
    <p class="case" data-expect="spilling page-scroll">
      Rechtsschutzversicherungsgesellschaftsangestellte
    </p>
  </body>
</html>
