<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sticky and fixed positioning</title>
    <style>
      body {
        margin: 16px;
        font: 16px/1.4 sans-serif;
      }
      .case {
        margin: 0 0 24px;
      }
      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="case" style="position: sticky; top: 0; background: #fff">
      <h2 class="truncate" style="width: 200px; margin: 0" data-expect="truncated">
        Sticky section title that is far too long
      </h2>
    </div>
    <aside style="position: fixed; left: 0; top: 100px; width: 160px; background: #f5f5f5">
      <a href="#" style="display: block; white-space: nowrap; overflow: hidden" data-expect="hidden"
        >Organization settings and members</a
      >
    </aside>
  </body>
</html>
