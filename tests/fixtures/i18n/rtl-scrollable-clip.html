<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>A clip in the part of an RTL page reached by scrolling left</title>
    <!-- RTL pages scroll left, so a cut at negative x can still be seen. Phase 6 review. -->
    <style>
      body {
        margin: 16px;
        font: 16px/1.4 sans-serif;
      }
      .case {
        margin: 0 0 24px;
      }
    </style>
  </head>
  <body>
    <div class="case" style="width: 1400px" data-expect="page-scroll">
      <div style="width: 200px; margin-inline-start: 1100px; overflow: hidden; white-space: nowrap">
        <span data-expect="hidden"
          >الشحن مجاني لجميع الطلبات التي تزيد عن أربعين يورو مع إمكانية الإرجاع</span
        >
      </div>
    </div>
  </body>
</html>
