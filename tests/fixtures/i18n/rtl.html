<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>Right-to-left text</title>
    <style>
      body {
        margin: 16px;
        font: 16px/1.4 sans-serif;
      }
      .case {
        margin: 0 0 24px;
      }
      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="case truncate" style="width: 150px" data-expect="truncated">
      تقرير الإيرادات الفصلية لجميع المناطق
    </div>
    <div class="case truncate" style="width: 400px" data-expect="ok">الإيرادات</div>
    <div
      class="case"
      style="width: 120px; white-space: nowrap; overflow: hidden"
      data-expect="hidden"
    >
      إعدادات الإشعارات والتفضيلات الخاصة
    </div>
  </body>
</html>
