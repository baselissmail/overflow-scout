<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Intentional partial previews</title>
    <style>
      body {
        margin: 16px;
        font: 16px/1.4 sans-serif;
      }
      .case {
        margin: 0 0 24px;
      }
      .preview {
        position: relative;
        width: 300px;
        max-height: 66px;
        overflow: hidden;
      }
      .preview::after {
        content: '';
        position: absolute;
        inset: auto 0 0;
        height: 32px;
        background: linear-gradient(transparent, #fff);
      }
    </style>
  </head>
  <body>
    <!--
      Both patterns cut text on purpose and give a visual cue. The engine can't
      tell intent from geometry alone, so it reports them as hidden text.
      Phase 6 dogfooding decides how to recognize them.
    -->
    <div class="case" style="width: 300px; overflow: hidden">
      <div style="display: flex; gap: 16px">
        <div style="flex: 0 0 200px">First slide caption</div>
        <div
          style="flex: 0 0 200px"
          data-expect="ok"
          data-limitation="carousels that show part of the next slide are reported as hidden text"
        >
          Second slide peeks into view
        </div>
      </div>
    </div>
    <div class="case">
      <p
        class="preview"
        data-expect="ok"
        data-limitation="'Read more' previews that fade out are reported as hidden text"
      >
        This article preview shows the first lines and fades out, with a Read more link below that
        expands the rest of the text for anyone who wants it.
      </p>
      <a href="#">Read more</a>
    </div>
  </body>
</html>
