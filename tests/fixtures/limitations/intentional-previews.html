<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Intentional partial previews</title>
    <style>
      body {
        margin: 16px;
        font: 16px/1.4 sans-serif;
      }
      .case {
        margin: 0 0 24px;
      }
      .preview {
        position: relative;
        width: 300px;
        max-height: 66px;
        overflow: hidden;
      }
      .preview::after {
        content: '';
        position: absolute;
        inset: auto 0 0;
        height: 32px;
        background: linear-gradient(transparent, #fff);
      }
    </style>
  </head>
  <body>
    <!--
      Both patterns cut text on purpose and give a visual cue. The carousel is
      recognized since Phase 6 (the slide is placed past the edge, not outgrown
      by its text). A fading "Read more" preview still is reported: its text
      does outgrow its box, and the fade is only paint.
    -->
    <div class="case" style="width: 300px; overflow: hidden">
      <div style="display: flex; gap: 16px">
        <div style="flex: 0 0 200px">First slide caption</div>
        <!-- Fixed in Phase 6: the slide's own box is placed past the edge, so it's a crop. -->
        <div style="flex: 0 0 200px" data-expect="ok">Second slide peeks into view</div>
      </div>
    </div>
    <div class="case">
      <p
        class="preview"
        data-expect="ok"
        data-limitation="'Read more' previews that fade out are reported as hidden text"
      >
        This article preview shows the first lines and fades out, with a Read more link below that
        expands the rest of the text for anyone who wants it.
      </p>
      <a href="#">Read more</a>
    </div>
    <!--
      A sidebar that scrolls only while hovered (`overflow: hidden`, and
      `overflow-y: auto` on :hover). Found while dogfooding (Phase 6). Telling
      it apart means reading the page's style rules.
    -->
    <style>
      .hover-scroll {
        width: 200px;
        max-height: 60px;
        overflow: hidden;
      }
      .hover-scroll:hover {
        overflow-y: auto;
      }
    </style>
    <nav class="case hover-scroll">
      <div>Getting started</div>
      <div>Components</div>
      <div
        data-expect="ok"
        data-limitation="sidebars that scroll only on hover are reported as hidden text"
      >
        Navigation
      </div>
    </nav>
  </body>
</html>
