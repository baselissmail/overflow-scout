<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Unbreakable words</title>
    <style>
      body {
        margin: 16px;
        font: 16px/1.4 sans-serif;
      }
      .case {
        margin: 0 0 24px;
      }
      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="case" style="width: 150px; border: 1px solid #ccc" data-expect="spilling">
      Rechtsschutzversicherungsgesellschaften
    </div>
    <div class="case" style="width: 150px; border: 1px solid #ccc" data-expect="spilling">
      9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
    </div>
    <div
      class="case"
      style="width: 150px; border: 1px solid #ccc; overflow-wrap: anywhere"
      data-expect="ok"
    >
      Rechtsschutzversicherungsgesellschaften
    </div>
    <div class="case" style="width: 150px; word-break: break-all" data-expect="ok">
      9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
    </div>
    <table class="case" style="table-layout: fixed; width: 300px">
      <tr>
        <td data-expect="spilling">Donaudampfschifffahrtsgesellschaft</td>
        <td data-expect="ok">Status</td>
        <td data-expect="ok">3</td>
      </tr>
    </table>
  </body>
</html>
