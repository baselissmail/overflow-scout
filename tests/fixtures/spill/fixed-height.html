<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixed height without clipping</title>
    <style>
      body {
        margin: 16px;
        font: 16px/1.4 sans-serif;
      }
      .case {
        margin: 0 0 24px;
      }
      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="case" style="width: 240px; height: 60px; border: 1px solid #ccc">
      <p style="margin: 0" data-expect="spilling">
        This card has a fixed height, but its description is long enough to run past the bottom
        border and overlap whatever comes next.
      </p>
    </div>
    <div style="height: 60px"></div>
    <div class="case" style="width: 240px; min-height: 60px; border: 1px solid #ccc">
      <p style="margin: 0" data-expect="ok">
        With min-height the card grows to fit its description, so nothing spills out of it.
      </p>
    </div>
  </body>
</html>
