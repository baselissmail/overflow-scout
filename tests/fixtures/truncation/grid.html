<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Truncation in grid layouts</title>
    <style>
      body {
        margin: 16px;
        font: 16px/1.4 sans-serif;
      }
      .case {
        margin: 0 0 24px;
      }
      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 80px;
        gap: 8px;
        width: 240px;
      }
      .grid-auto {
        display: grid;
        grid-template-columns: 1fr 80px;
        gap: 8px;
        width: 240px;
      }
    </style>
  </head>
  <body>
    <div class="case grid">
      <div>
        <div class="truncate" data-expect="truncated">
          Infrastructure monitoring dashboard overview
        </div>
      </div>
      <div data-expect="ok">Open</div>
    </div>
    <!--
      1fr has an automatic minimum, so the column grows and the grid overflows its box.
      The title that grew it is the finding. "Open" is only pushed along: its own cell
      fits it, and the grid has no visible edge for it to cross (Phase 6 dogfooding).
    -->
    <div class="case grid-auto">
      <div>
        <div class="truncate" data-expect="spilling">
          Infrastructure monitoring dashboard overview
        </div>
      </div>
      <div data-expect="ok">Open</div>
    </div>
    <div class="case grid" style="width: 500px">
      <div><div class="truncate" data-expect="ok">Dashboard</div></div>
      <div data-expect="ok">Open</div>
    </div>
  </body>
</html>
