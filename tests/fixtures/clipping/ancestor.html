<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Clipped by an ancestor</title>
    <style>
      body {
        margin: 16px;
        font: 16px/1.4 sans-serif;
      }
      .case {
        margin: 0 0 24px;
      }
      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <!-- Inline text clipped by its block ancestor -->
    <div class="case" style="width: 200px; overflow: hidden">
      <span style="white-space: nowrap" data-expect="hidden"
        >This inline label is much wider than its container</span
      >
    </div>
    <!-- Fixed table layout with a clipping cell -->
    <table class="case" style="table-layout: fixed; width: 300px; border-collapse: collapse">
      <tr>
        <td style="overflow: hidden; white-space: nowrap" data-expect="hidden">
          customer-account-identifier-long
        </td>
        <td data-expect="ok">Active</td>
        <td data-expect="ok">12</td>
      </tr>
    </table>
    <!-- Nested clippers: the narrower outer box does the clipping -->
    <div class="case" style="width: 120px; overflow: hidden">
      <div style="width: 300px; overflow: hidden; white-space: nowrap" data-expect="hidden">
        Outer box clips this long sentence of text
      </div>
    </div>
    <!-- An absolutely positioned box escapes a clipping parent that is not its containing block -->
    <div class="case" style="position: relative; height: 40px">
      <div style="width: 120px; height: 30px; overflow: hidden">
        <div style="position: absolute; top: 0; left: 0; white-space: nowrap" data-expect="ok">
          Absolutely positioned text escapes the clipping parent
        </div>
      </div>
    </div>
    <!-- ...but is clipped when its containing block clips -->
    <div class="case" style="position: relative; width: 150px; height: 40px; overflow: hidden">
      <div style="position: absolute; top: 0; left: 0; white-space: nowrap" data-expect="hidden">
        Positioned text clipped by its containing block
      </div>
    </div>
  </body>
</html>
