<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Width constrained by the parent</title>
    <style>
      body {
        margin: 16px;
        font: 16px/1.4 sans-serif;
      }
      .case {
        margin: 0 0 24px;
      }
      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .nowrap-clip {
        white-space: nowrap;
        overflow: hidden;
      }
      .card {
        width: 150px;
        border: 1px solid #ccc;
        padding: 8px;
      }
      .card .title {
        white-space: nowrap;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- Block child takes the parent's width -->
    <div class="case" style="width: 150px">
      <div class="nowrap-clip" data-expect="hidden">Organization billing settings</div>
    </div>
    <!-- width: 100% of a 200px parent -->
    <div class="case" style="width: 200px">
      <div class="nowrap-clip" style="width: 100%" data-expect="hidden">
        Manage team members and their roles
      </div>
    </div>
    <!-- Descendant selector: the clip rule only applies inside .card -->
    <div class="case card">
      <div class="title" data-expect="hidden">Quarterly revenue by region</div>
    </div>
    <div class="case card" style="width: 400px">
      <div class="title" data-expect="ok">Revenue</div>
    </div>
    <!-- Percentage width -->
    <div class="case" style="width: 300px">
      <div class="nowrap-clip" style="width: 40%" data-expect="hidden">
        Customer satisfaction survey results
      </div>
    </div>
  </body>
</html>
