<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tight line heights</title>
    <style>
      body {
        margin: 16px;
        font: 16px/1.4 sans-serif;
      }
      .case {
        margin: 0 0 24px;
      }
      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <h1 style="font-size: 40px; line-height: 1; overflow: hidden; margin: 0 0 16px">
      Tight heading glyphs
    </h1>
    <p class="case">
      <button
        style="
          height: 32px;
          line-height: 32px;
          overflow: hidden;
          padding: 0 12px;
          font: 16px sans-serif;
        "
      >
        Fixed height button
      </button>
    </p>
    <p class="case">
      <span
        style="
          display: inline-block;
          line-height: 1;
          overflow: hidden;
          font-size: 12px;
          padding: 0 4px;
          background: #eee;
        "
        >Badge</span
      >
    </p>
    <div
      class="case"
      style="height: 24px; line-height: 24px; overflow: hidden; white-space: nowrap; width: 300px"
    >
      Single line that fits its box
    </div>
  </body>
</html>
