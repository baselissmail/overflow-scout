<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Negative margins and hanging indents</title>
    <style>
      body {
        margin: 16px;
        font: 16px/1.4 sans-serif;
      }
      .case {
        margin: 0 0 24px;
      }
      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main style="max-width: 600px; margin: 0 auto; padding: 0 16px">
      <section style="margin: 0 -16px; padding: 16px; background: #eef">
        <p>Full-bleed section with negative margins and its own padding keeps text inside.</p>
      </section>
      <p style="padding-left: 1.5em; text-indent: -1.5em">
        Hanging indent paragraph with padding keeps the first line inside the box.
      </p>
    </main>
  </body>
</html>
