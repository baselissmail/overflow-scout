  previous: Previous place
  next: Next place
home:
  scan: Checks this page for text that’s cut off, truncated or overflowing. The page itself doesn’t change.
  stress: Makes every text as long as a translation would, shows what breaks, then puts the page back.
  inspect: Pick an element and see how much text fits in it.
  shortcut: Open this panel with $1.
  demoLabel: A button label grows longer, as it would in translation, until it no longer fits its button.
  demoCaption: The accents stand in for a translation that makes the label longer. Overflow Scout shows where it’s cut, and by how much.
