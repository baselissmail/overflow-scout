# Manifest strings. Chrome limits the description to 132 characters.
extName: Overflow Scout
extDescription: Find text that's cut off or overflowing, see what breaks when it gets longer, and get CSS fixes tested on the page.
actionTitle: Open Overflow Scout
contextMenuInspect: Try your own text here with Overflow Scout

# Drawn on the page while longer text is on it
overlay:
  stressActive: Longer text is on
  revert: Back to normal

# Side panel
