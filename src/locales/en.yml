fix:
  fixes: Fixes it.
  togetherFixes: Together, these fix it.
  improves: Helps, but $1 still doesn’t fit.
  togetherImproves: Together these help, but $1 still doesn’t fit.
  noChange: Doesn’t fix it on its own.
  togetherNoChange: Even together, these don’t fix it. The cause may be on another element.
  wider: $1 wider
  narrower: $1 narrower
  taller: $1 taller
  shorter: $1 shorter
  sizeOne: The box gets $1.
  sizeTwo: The box gets $1 and $2.
  sizeSame: The box keeps its size.
  addedNote: Also needed, found by trying the fixes above
advice:
  whiteSpace: Let the text wrap onto another line.
  textOverflow: The ellipsis hides the end. If the full text matters, let it wrap, or show it on hover with a title.
  lineClamp: Show more lines, or let readers expand the text.
  maxWidth: Let the box grow past this maximum width.
  width: Let the box size itself to its text.
  flex: Let this flex item give its text room, or let it shrink without hiding the text.
  grid: Give this grid column more room, or let it size to its content.
  height: Let the box grow with its text, using a minimum height instead of a fixed one.
  maxHeight: Raise or remove the maximum height.
  overflow: Hiding overflow cuts text silently. Fix the size instead, or add an ellipsis so readers can tell.
  overflowWrap: Let long words, URLs and email addresses break.
  minWidth: Remove the minimum width, or keep it within the window.
  pageWidth: Keep the element within the window.
  field: Widen the field, or shorten the text.
stress:
  heading: Test with longer text
  strategy: Strategy
  intensity: Intensity
  language: Language
  rtl: Right-to-left layout
  rtlDescription: Sets the page direction to right-to-left while longer test text is on.
  scope: Scope
  scopePage: Whole page
  scopePicked: Picked element
  apply: Apply and scan
  active: Longer test text is on the page. Revert puts every text back exactly.
  activeTranslation: The accented words are added on purpose, to make each text as long as a translation.
  activePseudo: The accents and [brackets] are added on purpose. A missing ] shows where a text was cut.
  activeLongWords: The long words, links and email addresses are added on purpose, to test text that can’t wrap.
  activeLanguage: The text is replaced with real text in another language, to test other scripts.
  scopePickedHint: To test one element, pick it with Measure an element first.
strategy:
  translation: Translation length
  pseudo: Pseudo-locale
  longWords: Long words
  language: Language samples
strategyDescription:
  translation: Adds accented copies of each string’s words, up to the length a translation needs.
  pseudo: Accents every letter and brackets each string. A missing ] means the end was cut off.
  longWords: Adds a long word, URL or email address that can’t wrap.
  language: Replaces text with real text in another language and script.
intensity:
  realistic: Realistic
  worst: Worst case
  extreme: Extreme
intensityDescription:
  realistic: The length most translations reach. Best for deciding what to fix.
  worst: The long end of the range, which only some languages reach.
  extreme: Twice the worst case, to see how robust a layout is.
