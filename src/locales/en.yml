# Manifest strings. Chrome limits the description to 132 characters.
extName: Overflow Scout
extDescription: Find clipped and truncated text before users do. Stress-test with translation-length text and get verified CSS fixes.
actionTitle: Open Overflow Scout
contextMenuInspect: Inspect text overflow here

# Drawn on the page while stress text is applied
overlay:
  stressActive: Stress test active
  revert: Revert

# Side panel. Sentence case, plain verbs; see docs/design/DIRECTION.md.
tagline: Find text that gets cut off, before your users do.
