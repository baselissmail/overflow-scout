  checked:
    1: Found in 1 text.
    n: Found in $1 texts.
  new: New
  noneTitle: Nothing is cut off
  noneBody: All $1 texts on this page fit. Choose Longer to see if they still fit once translated.
  noneLongerTitle: Nothing breaks with longer text
  noneLongerBody: All $1 texts still fit at this length.
  noMatches: No problems match your search.
  search: Search problems
  searchPlaceholder: Search
  ignoredLabel: Ignored
  showIgnored:
    1: Show 1 ignored
    n: Show $1 ignored
  hideIgnored: Hide ignored
  places:
    1: 1 place
    n: $1 places
  # Report section titles
  atRisk: New with longer text
  brokenNow: Already broken
  noneAtRisk: Nothing else breaks with longer text.
  noneNow: Nothing was broken before the text got longer.
kind:
  hidden: Cut off
  pageScroll: Wider than the window
  truncated: Cut short
  spilling: Spills out
  input: Too long for its field
kindDescription:
  hidden: The box hides the end of the text, and nothing shows that it's missing.
  pageScroll: This element is wider than the browser window, so the whole page scrolls sideways.
  truncated: The text ends in "..." or stops after a few lines, so readers miss the end. Sometimes this is on purpose.
  spilling: The text runs out of its box and can cover what's next to it.
  input: A placeholder or read-only value is longer than its field.
severity:
  critical: Critical
  warning: Warning
  notice: Notice
detail:
  visible: Visible
  lost: Cut off
  spills: Spills out
  place: Place $1 of $2
  measure: Needs $1, has $2. $3 short.
  measureY: Needs $1 of height, has $2. $3 short.
  pageWider: Reaches $1 past the $2 window.
  text: Text
  before: Before
  cause: Likely cause
  why: Why it happens
  confidenceHigh: High confidence
  confidenceMedium: Medium confidence
  noCause: No single CSS property explains this.
  element: Element
  selector: CSS selector
  growth: Text $1x longer
  fix: How to fix it
  on: On $1
  suggestionNote: These weren't tried on the page. They're based on the likely cause.
  trying: Trying each fix on the page...
  tried: Each fix was tried on the page for a moment, then removed.
  screenshotSaved: The clipboard isn't available, so the screenshot was saved to your downloads.
  screenshotFailed: "Couldn't take a screenshot: $1"
  screenshotHidden: Switch to this tab first. A screenshot shows the tab that's in front.
  screenshotNeedsClick: Chrome allows screenshots only after you click the Overflow Scout button in the toolbar. Click it, then try again.
fix:
  fixes: Fixes it.
  togetherFixes: Together, these fix it.
  improves: Helps, but $1 still doesn't fit.
  togetherImproves: Together these help, but $1 still doesn't fit.
  noChange: Doesn't fix it on its own.
  togetherNoChange: Even together, these don't fix it. The cause may be on another element.
  wider: $1 wider
  narrower: $1 narrower
  taller: $1 taller
  shorter: $1 shorter
  sizeOne: The box gets $1.
  sizeTwo: The box gets $1 and $2.
  sizeSame: The box keeps its size.
  addedNote: Also needed, found by trying the fixes above
advice:
  whiteSpace: Let the text wrap onto another line.
  textOverflow: The "..." hides the end. If the full text matters, let it wrap, or show it on hover with a title.
  lineClamp: Show more lines, or let readers expand the text.
  maxWidth: Let the box grow past this maximum width.
  width: Let the box size itself to its text.
  flex: Let this flex item give its text room, or let it shrink without hiding the text.
  grid: Give this grid column more room, or let it size to its content.
  height: Let the box grow with its text, using a minimum height instead of a fixed one.
  maxHeight: Raise or remove the maximum height.
  overflow: Hiding overflow cuts text silently. Fix the size instead, or add "..." so readers can tell.
  overflowWrap: Let long words, links and email addresses break.
  minWidth: Remove the minimum width, or keep it within the window.
  pageWidth: Keep the element within the window.
  field: Widen the field, or shorten the text.
