kind:
  hidden: Cut off
  pageScroll: Wider than window
  truncated: Truncated
  spilling: Overflows
  input: Field cut off
kindDescription:
  hidden: The box clips its text with no ellipsis, so readers lose part of it without knowing.
  pageScroll: This element is wider than the browser window, so the whole page scrolls sideways.
  truncated: The text ends in an ellipsis (…) or stops after a few lines. Often intended, but the end is lost.
  spilling: The text runs out of its box and can overlap what’s next to it.
  input: A placeholder or read-only value is longer than its field.
