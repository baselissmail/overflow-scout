# Manifest strings. Chrome limits the description to 132 characters.
extName: Overflow Scout
extDescription: Find clipped and truncated text before users do. Test with translation-length text and get CSS fixes to try.
actionTitle: Open Overflow Scout
contextMenuInspect: Measure this element with Overflow Scout

# Drawn on the page while longer test text is applied
overlay:
  stressActive: Longer test text on
  revert: Revert

# Side panel. Sentence case, plain verbs; see docs/design/DIRECTION.md.
tagline: Find text that gets cut off, before your users do.
actions:
  scan: Scan page
  scanAgain: Scan again
  stress: Test with longer text
  inspect: Measure an element
  stopInspecting: Stop measuring
  # Toolbar labels once results are showing; Home and the palette use the full names.
  stressShort: Longer text
  inspectShort: Measure
  demo: Try the demo page
  openDemo: Open the demo page
  revert: Revert
  reapply: Re-apply
  alwaysAllow: Always allow on this site
