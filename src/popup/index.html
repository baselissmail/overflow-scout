<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overflow Scout</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🔍 Overflow Scout</h1>
      <p class="subtitle">Stress-test UI text overflow</p>
    </header>

    <section class="stats-section">
      <div class="stat-card">
        <div class="stat-value" id="tested-count">0</div>
        <div class="stat-label">Tested</div>
      </div>
      <div class="stat-card">
        <div class="stat-value broken" id="broken-count">0</div>
        <div class="stat-label">Broken</div>
      </div>
    </section>

    <section class="mode-section">
      <label class="section-label">Testing Mode</label>
      <div class="mode-presets">
        <button class="preset-btn active" data-preset="scan">
          <span class="preset-icon">🔍</span>
          <span class="preset-label">Scan</span>
          <small>Fast & Clean</small>
        </button>
        <button class="preset-btn" data-preset="deep">
          <span class="preset-icon">🔬</span>
          <span class="preset-label">Deep</span>
          <small>Full Test</small>
        </button>
      </div>
    </section>

    <section class="options-section">
      <button class="options-toggle" id="options-toggle">
        ⚙️ Options
        <span class="toggle-arrow">▼</span>
      </button>
      <div class="options-content" id="options-content" style="display: none;">
        <label class="option-item">
          <input type="checkbox" id="viewport-only" checked>
          <span>Viewport only (faster)</span>
        </label>
        <label class="option-item">
          <input type="checkbox" id="show-broken-only" checked>
          <span>Show broken only</span>
        </label>
        <label class="option-item">
          <span>Text length: <span id="length-value">2.5x</span></span>
          <input type="range" id="length-multiplier" 
                 min="1.5" max="5" value="2.5" step="0.5">
        </label>
        <label class="option-item">
          <span>Language:</span>
          <select id="mode-selector" class="mode-select-small">
            <option value="default">English</option>
            <option value="german">German</option>
            <option value="arabic">Arabic (RTL)</option>
            <option value="cjk">CJK</option>
            <option value="ugc">UGC</option>
            <option value="mixed">Mixed</option>
          </select>
        </label>
      </div>
    </section>

    <section class="actions-section">
      <button id="interactive-mode" class="btn btn-interactive">
        <span class="btn-icon">👆</span>
        Point & Click Mode
        <small>Click elements to test</small>
      </button>
      
      <div class="divider">or batch test</div>
      
      <button id="test-all-buttons" class="btn btn-secondary">
        <span class="btn-icon">🔘</span>
        Test All Buttons
      </button>
      <button id="test-all-headings" class="btn btn-secondary">
        <span class="btn-icon">📰</span>
        Test All Headings
      </button>
      <button id="test-all-inputs" class="btn btn-secondary">
        <span class="btn-icon">📝</span>
        Test All Inputs
      </button>
      <button id="test-all-links" class="btn btn-secondary">
        <span class="btn-icon">🔗</span>
        Test All Links
      </button>
    </section>

    <section class="actions-section">
      <button id="revert-all" class="btn btn-danger">
        <span class="btn-icon">↩️</span>
        Revert All
      </button>
    </section>

    <footer class="footer">
      <div class="footer-text">
        Right-click any element for more options
      </div>
    </footer>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
