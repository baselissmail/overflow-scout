<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overflow Scout</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🔍 Overflow Scout</h1>
      <p class="subtitle">Find text overflow issues</p>
    </header>

    <section class="actions-section">
      <button id="auto-scan" class="btn btn-auto-scan">
        <span class="btn-icon">🤖</span>
        Auto-Scan Page
        <small>Find all overflow issues instantly</small>
      </button>
      
      <button id="interactive-mode" class="btn btn-interactive">
        <span class="btn-icon">👆</span>
        Point & Click Mode
        <small>Click elements to test</small>
      </button>
    </section>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
