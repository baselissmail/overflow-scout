<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overflow Scout</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🔍 Overflow Scout</h1>
      <p class="subtitle">Stress-test UI text overflow</p>
    </header>

    <section class="stats-section">
      <div class="stat-card">
        <div class="stat-value" id="tested-count">0</div>
        <div class="stat-label">Tested</div>
      </div>
      <div class="stat-card">
        <div class="stat-value broken" id="broken-count">0</div>
        <div class="stat-label">Broken</div>
      </div>
    </section>

    <section class="mode-section">
      <label class="section-label">Test Mode</label>
      <select id="mode-selector" class="mode-select">
        <option value="default">English</option>
        <option value="german">German (Übersetzung)</option>
        <option value="arabic">Arabic (RTL)</option>
        <option value="cjk">CJK (中文/日本語)</option>
        <option value="ugc">UGC (Emojis & Caps)</option>
        <option value="mixed">Mixed (All Languages)</option>
      </select>
    </section>

    <section class="actions-section">
      <button id="test-all-buttons" class="btn btn-primary">
        <span class="btn-icon">🔘</span>
        Test All Buttons
      </button>
      <button id="test-all-headings" class="btn btn-primary">
        <span class="btn-icon">📰</span>
        Test All Headings
      </button>
      <button id="test-all-inputs" class="btn btn-primary">
        <span class="btn-icon">📝</span>
        Test All Inputs
      </button>
      <button id="test-all-links" class="btn btn-primary">
        <span class="btn-icon">🔗</span>
        Test All Links
      </button>
    </section>

    <section class="actions-section">
      <button id="revert-all" class="btn btn-danger">
        <span class="btn-icon">↩️</span>
        Revert All
      </button>
    </section>

    <footer class="footer">
      <div class="footer-text">
        Right-click any element for more options
      </div>
    </footer>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
