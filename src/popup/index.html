<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overflow Scout</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-content">
        <div>
          <h1>🔍 Overflow Scout</h1>
          <p class="subtitle">Find text overflow issues</p>
        </div>
        <button id="theme-toggle" class="theme-toggle" title="Toggle theme">
          <span class="theme-icon">🌙</span>
        </button>
      </div>
    </header>

    <section class="actions-section">
      <button id="auto-scan" class="btn btn-auto-scan">
        <span class="btn-icon">🤖</span>
        Auto-Scan Page
        <small>Find all overflow issues instantly</small>
      </button>
      
      <button id="interactive-mode" class="btn btn-interactive">
        <span class="btn-icon">👆</span>
        Point & Click Mode
        <small>Click elements to test</small>
      </button>
    </section>
    
    <!-- Footer Credit -->
    <footer style="
      margin-top: 16px;
      padding: 10px 0;
      border-top: 1px solid #e5e7eb;
      text-align: center;
    ">
      <a id="linkedin-link" href="https://www.linkedin.com/in/basel-issmail/" target="_blank" rel="noopener noreferrer" style="
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 11px;
        color: #9ca3af;
        text-decoration: none;
        transition: color 0.2s;
        line-height: 1;
      ">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="display: block;">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
        </svg>
        <span style="display: block;">Made by Basel Issmail</span>
      </a>
    </footer>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
